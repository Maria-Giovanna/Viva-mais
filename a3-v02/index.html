<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-fontsize="standard">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo ao Viva+</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/welcome.css">
</head>

<body>
    <main id="main-content" class="welcome-layout">
        <section class="welcome-illustration" aria-labelledby="welcome-help-title">
            <div class="welcome-speech-bubble">
                <p class="bubble-title" id="welcome-help-title">Como acessar?</p>

                <div class="bubble-option">
                    <span class="bubble-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                            <path
                                d="M7 14a5 5 0 1 1 4.58-7H22v4h-3v3h-3v3h-4.42A5 5 0 0 1 7 14Zm0-3a2 2 0 1 0 0-4a2 2 0 0 0 0 4Z" />
                        </svg>
                    </span>

                    <div class="bubble-option-text">
                        <strong>Entrar</strong>
                        <span>Já tenho senha neste site.</span>
                    </div>
                </div>

                <div class="bubble-option">
                    <span class="bubble-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" focusable="false">
                            <path
                                d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5s-5 2.24-5 5s2.24 5 5 5Zm0 2c-4.42 0-8 2.24-8 5v1c0 1.1.9 2 2 2h7.25A7.96 7.96 0 0 1 12 18c0-1.46.39-2.82 1.07-4H12Zm7 1c.55 0 1 .45 1 1v2h2c.55 0 1 .45 1 1s-.45 1-1 1h-2v2c0 .55-.45 1-1 1s-1-.45-1-1v-2h-2c-.55 0-1-.45-1-1s.45-1 1-1h2v-2c0-.55.45-1 1-1Z" />
                        </svg>
                    </span>

                    <div class="bubble-option-text">
                        <strong>Ativar acesso</strong>
                        <span>Tenho plano, mas é meu primeiro acesso.</span>
                    </div>
                </div>
            </div>

            <img src="assets/img/Mascote-Olá.svg" alt="" class="mascot-img" aria-hidden="true">
        </section>

        <section class="welcome-content" aria-labelledby="welcome-title">
            <div class="content-wrapper">
                <header class="welcome-header">
                    <h1 class="page-title" id="welcome-title">
                        Seja bem-vindo<br>ao <img src="assets/img/logo-viva+escrito.svg" alt="Viva+"
                            class="logo-inline">!
                    </h1>
                    <p class="page-description">
                        Agende suas consultas, exames e<br>
                        vacinas de forma <strong class="text-highlight">simples e segura</strong>.
                    </p>
                </header>

                <nav class="welcome-actions" aria-label="Ações de acesso à conta">
                    <a href="login.html" class="btn btn-primary">Entrar</a>
                    <a href="cadastro.html" class="btn btn-secondary">Ativar meu acesso</a>
                </nav>
            </div>
        </section>
    </main>

    <script src="js/a11y.js"></script>
</body>

</html>
