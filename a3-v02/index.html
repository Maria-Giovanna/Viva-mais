    <section class="welcome-content" aria-labelledby="welcome-title">
        <div class="content-wrapper">
            <header class="welcome-header">
                <h1 class="page-title" id="welcome-title">
                    Seja bem-vindo<br>
                    ao <img src="assets/img/logo-viva+escrito.svg" alt="Viva+" class="logo-inline">!
                </h1>

                <p class="page-description">
                    Agende suas consultas, exames e<br>
                    vacinas de forma <strong class="text-highlight">simples e segura</strong>.
                </p>
            </header>

            <nav class="welcome-actions" aria-label="Ações de acesso à conta">
                <a href="login.html" class="btn btn-primary welcome-action-link">
                    Entrar
                </a>

                <a href="cadastro.html" class="btn btn-secondary welcome-action-link">
                    Ativar meu acesso
                </a>
            </nav>
        </div>

    </main>
