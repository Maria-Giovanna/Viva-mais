<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-fontsize="standard">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Viva+</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/auth-pages.css">
</head>

<body>
    <!--
        Pagina de login.
        Recebe CPF e senha, valida os dados em js/auth.js e inicia a sessao
        salvando o usuario logado no sessionStorage.
    -->
    <main id="main-content" class="auth-container">
        <!-- Faixa lateral visual usada no desktop; fica escondida de leitores de tela. -->
        <section class="auth-sidebar" aria-hidden="true">
            <div class="sidebar-wrapper">
                <img src="assets/img/LOGO-VIVA+.svg" alt="" class="sidebar-mascot">
                <p class="sidebar-text">Sua saúde de forma simples e segura.</p>
            </div>
        </section>
    
        <section class="auth-content">
            <div class="form-card-wrapper">
                <!-- Formulario principal de acesso. Os erros aparecem nos spans field-error. -->
                <header class="auth-header">
                    <button type="button" class="btn-back" aria-label="Voltar para a tela inicial"
                        onclick="window.location.href='index.html'">
                        <img src="assets/icons/icon-voltar.svg" alt="" aria-hidden="true">
                        <span>Voltar</span>
                    </button>
                    <h1 class="auth-title">Login</h1>
                    <p class="auth-subtitle">Use seu CPF e sua senha para acessar sua conta.</p>
                </header>
    
                <form id="form-login" novalidate>
                    <div class="form-group">
                        <label for="cpf" class="form-label">CPF</label>
                        <div class="input-container">
                            <input type="text" id="cpf" name="cpf" class="form-input" placeholder="Somente números"
                                inputmode="numeric" pattern="[0-9]*" maxlength="14" required aria-required="true"
                                aria-invalid="false" aria-describedby="cpf-error">
                        </div>
                        <span id="cpf-error" class="field-error" role="alert" aria-live="assertive" hidden>
                            Não encontramos uma conta ativa com este CPF.
                        </span>
                    </div>
    
                    <div class="form-group">
                        <label for="senha" class="form-label">Senha</label>
                        <div class="input-container">
                            <input type="password" id="senha" name="senha" class="form-input has-password-toggle"
                                placeholder="Senha de 8 números" inputmode="numeric" pattern="[0-9]*" maxlength="8"
                                data-only-numbers="true" required aria-required="true" aria-invalid="false"
                                aria-describedby="senha-error">
                            <button type="button" class="btn-toggle-password" aria-label="Mostrar senha escrita como texto"
                                aria-pressed="false">
                                <img src="assets/icons/icon-visivel.svg" class="olho-aberto" alt="" aria-hidden="true">
                                <img src="assets/icons/icon-nao-visivel.svg" class="olho-fechado" alt="" aria-hidden="true">
                            </button>
                        </div>
                        <span id="senha-error" class="field-error" role="alert" aria-live="assertive" hidden>
                            A senha digitada não confere. Lembre-se que sua senha deve ter 8 números.
                        </span>
                    </div>
    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                        <a href="recuperar-senha.html" class="auth-link">Esqueci minha senha</a>
                    </div>
                </form>
            </div>
        </section>
    </main>
    
    <script src="js/a11y.js"></script>
    <script src="js/util.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
